[package]
name = "vae"
description = "Short name for vaegram, a Telegram MTProto client library for users and bots"
version = "0.4.0-nightly.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/rjriajul/vaegram"
readme = "../README.md"
keywords = ["telegram", "mtproto", "bot", "client", "async"]
categories = ["api-bindings", "network-programming", "asynchronous"]

[dependencies]
vaegram = { path = "..", version = "0.4.0-nightly.2" }

[features]
# `#[derive(BotCommands)]`. Give the enum `#[command(crate = "vae")]` so the code it writes names this crate.
macros = ["vaegram/macros"]

[[test]]
name = "command_derive"
required-features = ["macros"]
