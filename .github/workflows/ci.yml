name: vaegram

on: [push, pull_request]

permissions:
  contents: read

# Debuginfo and incremental caches make up most of target/ and don't help a one-shot CI build; skipping them keeps builds smaller and faster.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        toolchain: ["1.85", stable]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Test
        run: cargo test --workspace --all-features

      # `--all-features` would hide a TL type leaking out of `unstable-raw`; the doc tests check it's absent.
      - name: Default features
        if: matrix.toolchain == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --doc

      - name: Clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Format
        if: matrix.toolchain == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Package
        if: matrix.toolchain == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo publish --dry-run -p vaegram

      - name: Disk space
        if: always() && runner.os != 'Windows'
        run: df -h && du -sh target

  # The storage engines' write paths against real servers. Their tests are #[ignore]d everywhere else.
  storage-services:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaegram_test
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres -d vaegram_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      VAEGRAM_MONGO_URL: mongodb://localhost:27017
      VAEGRAM_REDIS_URL: redis://localhost:6379
      VAEGRAM_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/vaegram_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # Each engine's conformance test, which is #[ignore]d everywhere else: each needs its server above.
      - name: Storage conformance on live servers
        run: cargo test -p vaegram --features mongodb,redis,postgres --lib -- --ignored conformance_on_a_live_server

      # The rest of the PostgreSQL engine's live tests: reconnecting, timeouts and one schema per session. Each uses
      # its own schema, so they run together. Same features as the step above, so nothing is built twice.
      - name: PostgreSQL storage on a live server
        run: cargo test -p vaegram --features mongodb,redis,postgres --lib -- --ignored storage::postgres_storage

      - name: Disk space
        if: always()
        run: df -h
