[package]
name = "vaegram"
description = "Telegram MTProto client library for users and bots"
version = "0.4.0-nightly.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/rjriajul/vaegram"
readme = "README.md"
keywords = ["telegram", "mtproto", "bot", "client", "async"]
categories = ["api-bindings", "network-programming", "asynchronous"]
exclude = [".github", "tools", "tests/botapi_coverage.rs"]

[workspace]
members = ["vae", "vaegram-macros"]

[dependencies]
crc32fast = "1"
flate2 = "1"
getrandom = "0.2"
num-bigint = "0.4"
rpassword = "7"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "net", "io-util", "rt", "signal", "sync", "time", "macros"] }
warpcrypto = "2.2"

# Optional, each behind the feature of the same purpose below.
# The webhook server: all three already in the dependency graph through reqwest.
http-body-util = { version = "0.1.2", optional = true }
hyper = { version = "1.6", optional = true, features = ["server", "http1"] }
hyper-util = { version = "0.1.10", optional = true, features = ["tokio"] }
metrics = { version = "0.24", optional = true }
mongodb = { version = "3.6", optional = true }
object_store = { version = "0.14", optional = true, default-features = false, features = ["aws"] }
opentelemetry = { version = "0.33", optional = true, default-features = false, features = ["trace"] }
redb = { version = "2.6", optional = true }
redis = { version = "1.2", optional = true, default-features = false, features = ["tokio-comp", "connection-manager"] }
regex = { version = "1.12", optional = true }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls-no-provider", "multipart"] }
rusqlite = { version = "0.40", optional = true, default-features = false, features = ["bundled"] }
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", optional = true, features = ["derive", "rc"] }
serde_json = { version = "1", optional = true }
tokio-postgres = { version = "0.7", optional = true }
tokio-rustls = { version = "0.26.6", optional = true, default-features = false, features = ["ring", "tls12"] }
# `#[derive(BotCommands)]`. Pinned to this exact version: the code it writes calls `vaegram::commands` helpers.
vaegram-macros = { path = "vaegram-macros", version = "=0.4.0-nightly.2", optional = true }
webpki-roots = { version = "1", optional = true }

# `flock` for the session file lock. Already in the dependency graph through tokio on Unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# `ToJson` for every TL type and function; off by default to keep the generated code small.
json = []
# `serde::Serialize` for the friendly types users receive (`Message`, `User`, `Chat`, ...), not for TL types.
serde = ["dep:serde"]
# TL objects behind `RawUpdate` (`raw()`, `raw_users()`, `raw_chats()`), `Incoming::into_updates()` and
# `UploadedFile::into_raw()`, and the session plumbing below `Client`: `connection::Connection` and
# `session::{Session, UpdatesRx, Incoming, Events}`. The live tests that open a bare session need it.
# Experimental: may change or go away in any release.
unstable-raw = []
# Storage engines.
sqlite = ["dep:rusqlite"]
redb = ["dep:redb"]
redis = ["dep:redis"]
mongodb = ["dep:mongodb"]
postgres = ["dep:tokio-postgres"]
s3 = ["dep:object_store"]
vault = ["dep:reqwest", "dep:serde_json", "dep:rustls", "dep:webpki-roots"]
# `dialogue::JsonFileStorage`: dialogue states in a JSON file, for state types with serde's derives.
dialogue-json = ["dep:serde", "dep:serde_json"]
# `bot_api::BotApi`: a bot over the Bot API's HTTPS interface instead of MTProto. Experimental in the 0.4.0 nightlies.
bot-api = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:rustls", "dep:webpki-roots"]
# `bot_api::Webhook::serve`: a built-in HTTP server for the bot's webhook. Experimental in the 0.4.0 nightlies.
webhook-server = ["bot-api", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]
# `#[derive(BotCommands)]`, the `commands::BotCommands` trait written from an enum.
macros = ["dep:vaegram-macros"]
# Observability.
metrics = ["dep:metrics"]
opentelemetry = ["dep:opentelemetry"]
# `filters::regex`.
regex = ["dep:regex"]
# Transports over TLS.
websocket = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]
dns-config = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]
web-proxy = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]

[dev-dependencies]
metrics-util = "0.20"
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
rcgen = { version = "0.14.7", default-features = false, features = ["pem", "ring"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[[bench]]
name = "tl"
harness = false

[[bench]]
name = "session"
harness = false

[[example]]
name = "dump_recording"
required-features = ["json"]

[[test]]
name = "command_derive"
required-features = ["macros"]
